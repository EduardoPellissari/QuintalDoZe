<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Quintal do Zé | Login</title>
  <link rel="icon" href="/assets/icons/icon-192.png" type="image/png">
  <link rel="manifest" href="/manifest.webmanifest">
  <meta name="theme-color" content="#080808">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Quintal do Zé">
  <link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/styles.css">
</head>
<body class="login-modern-body">
  <div class="login-bg"></div>

  <main class="login-modern-screen">
    <section class="login-modern-card">
      <div class="login-brand-area">
        <img src="/assets/logo.jpg" alt="Logo Quintal do Zé">
        <span id="loginSystemName">Sistema De Pedidos</span>
        <h1 id="loginBrandName">Quintal do Zé</h1>
        <p id="loginBrandText"></p>
      </div>

      <div class="login-right">
        <form id="loginForm" class="login-modern-form">
          <h2 id="loginTitle">Entrar no sistema</h2>
          <p id="loginSubtitle" class="muted">Use seu perfil para acessar somente a área liberada.</p>

          <label>
            <span id="loginEmailLabel">E-mail</span>
            <input id="loginEmail" type="email" autocomplete="username">
          </label>

          <label>
            <span id="loginPasswordLabel">Senha</span>
            <div class="password-action-row">
              <input id="loginPassword" type="password" autocomplete="current-password">
              <button id="toggleLoginPassword" class="soft password-toggle-button" type="button">Mostrar</button>
            </div>
          </label>

          <label class="login-save-option">
            <input id="rememberLogin" type="checkbox">
            <span>Salvar login e senha neste computador</span>
          </label>

          <button id="loginButton" class="login-modern-button" type="submit">Entrar</button>
          <p id="loginMsg" class="error"></p>
        </form>

        <div id="installAppBox" class="login-install-box hidden">
          <div>
            <b>Instalar como aplicativo</b>
            <span id="installAppText">Adicione o sistema na tela inicial para abrir como app.</span>
          </div>
          <button id="installAppButton" class="soft" type="button">Instalar app</button>
        </div>

        <div class="login-modern-help">
          <b id="loginAccessTitle">O quintal mais brasileiro que existe!</b>
        </div>
      </div>
    </section>
  </main>

  <div class="dev-footer">
    Desenvolvido por <b>KavCode</b>
  </div>

  <script src="/js/textos.js"></script>
  <script src="/js/common.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
