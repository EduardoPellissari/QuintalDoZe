<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sem conexão | Quintal do Zé</title>
  <link rel="icon" href="/assets/icons/icon-192.png" type="image/png">
  <meta name="theme-color" content="#080808">
  <style>
    :root{color-scheme:dark;--gold:#f6c400;--gold2:#ffdf57;--txt:#f8f4eb;--muted:#b8afa4}
    *{box-sizing:border-box}
    body{min-height:100vh;min-height:100dvh;margin:0;display:grid;place-items:center;padding:22px;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:radial-gradient(circle at top left,rgba(246,196,0,.24),transparent 30%),linear-gradient(135deg,#080808,#171717);color:var(--txt)}
    main{width:min(520px,100%);padding:28px;border-radius:28px;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.13);box-shadow:0 24px 70px rgba(0,0,0,.45)}
    img{width:82px;height:82px;border-radius:22px;object-fit:cover;box-shadow:0 14px 34px rgba(0,0,0,.28)}
    span{display:inline-flex;margin-top:20px;padding:7px 11px;border-radius:999px;color:#151515;background:linear-gradient(135deg,var(--gold),var(--gold2));font-size:12px;font-weight:950;text-transform:uppercase}
    h1{margin:12px 0 8px;font-size:clamp(30px,8vw,44px);line-height:1}
    p{margin:0;color:var(--muted);font-weight:800;line-height:1.5}
    button{width:100%;min-height:52px;margin-top:22px;border:0;border-radius:15px;color:#151515;background:linear-gradient(135deg,var(--gold),var(--gold2));font:inherit;font-weight:900;cursor:pointer}
  </style>
</head>
<body>
  <main>
    <img src="/assets/icons/icon-192.png" alt="Logo Quintal do Zé">
    <span>Sem internet</span>
    <h1>Conexão indisponível</h1>
    <p>O aplicativo abriu, mas precisa de internet para carregar pedidos, caixa, produtos e banco de dados em tempo real.</p>
    <button type="button" onclick="location.reload()">Tentar novamente</button>
  </main>
</body>
</html>
